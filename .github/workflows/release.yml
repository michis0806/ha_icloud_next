name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Only stable version tags are supported')
          manifest = json.loads(Path('custom_components/icloud_next/manifest.json').read_text())
          if tag != 'v' + manifest['version']:
              raise SystemExit('Tag does not match integration version')
          notes = Path('.github/release-notes') / (tag + '.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('Version-specific release notes are required')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --title "iCloud Next $RELEASE_TAG"
          --notes-file ".github/release-notes/$RELEASE_TAG.md"
          --latest
